# Garage für die Fotos (M3), ein Knoten. Das RPC-Geheimnis legt `deploy/fotos-init.sh` außerhalb von
# deploy/ ab (rsync --delete würde es sonst löschen). Ein Admin-Token steht hier bewusst nicht:
# Die Admin-API nimmt dann nur Tokens an, die `fotos-init.sh` mit eingeschränktem Umfang anlegt.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret_file = "/etc/garage-secrets/rpc_secret"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
