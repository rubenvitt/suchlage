# Betrieb M1 auf dem vServer. MQTT, RTMP und WebRTC-UDP nur an der Tailscale-IP (Spec §6);
# der Server nur an 127.0.0.1 für Traefik. Traefik routet /internal/* NICHT nach außen (ADR 0003).
name: suchlage-m1

services:
  server:
    image: suchlage:m1
    environment:
      SUCHLAGE_PUBLIC_URL: "${SUCHLAGE_PUBLIC_URL:?öffentliche Adresse, z. B. https://suchlage.example.org}"
    ports: ["127.0.0.1:8080:8080"]
    # Videoablage von MediaMTX beschreibbar: Der Server löscht Aufzeichnungen (SUCHLAGE_DATA_DIR/video).
    volumes: ["server-data:/data", "video:/data/video"]
    depends_on: [mqtt, media, fotos]
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2.0.22
    entrypoint: ["/entrypoint.sh"]
    ports: ["${SUCHLAGE_BIND_IP:?Tailscale-IP}:1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.m1.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/entrypoint.sh:/entrypoint.sh:ro
      - mqtt-data:/mosquitto/data
    restart: unless-stopped

  # Gehört der Videoablage dem Server-Nutzer (nonroot, 65532), darf der Server Segmente löschen.
  # Läuft vor jedem Start, damit auch ältere, von root geschriebene Aufzeichnungen übergehen.
  video-init:
    image: busybox:1.37.0-uclibc
    command: ["chown", "-R", "65532:65532", "/recordings"]
    volumes: ["video:/recordings"]

  media:
    image: bluenviron/mediamtx:1.21.2
    user: "65532:65532"
    depends_on: {video-init: {condition: service_completed_successfully}}
    environment:
      MTX_WEBRTCADDITIONALHOSTS: "${SUCHLAGE_BIND_IP:?}"
      MTX_AUTHHTTPADDRESS: http://server:8080/internal/media/auth
    ports:
      - "${SUCHLAGE_BIND_IP:?}:1935:1935"
      - "${SUCHLAGE_BIND_IP:?}:8189:8189/udp"
    volumes:
      - ./mediamtx.m1.yml:/mediamtx.yml:ro
      - video:/recordings
    restart: unless-stopped

  # Fotospeicher (M3). S3 (3900) nur an der Tailscale-IP: Pilot 2 lädt direkt hoch. Die Admin-API
  # (3903) bleibt im Compose-Netz. Einrichtung einmalig mit deploy/fotos-init.sh.
  fotos:
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "server", "--single-node"]
    ports: ["${SUCHLAGE_BIND_IP:?}:3900:3900"]
    volumes:
      - ./garage/garage.m1.toml:/etc/garage.toml:ro
      - ../garage-secrets:/etc/garage-secrets:ro
      - fotos-meta:/var/lib/garage/meta
      - fotos-data:/var/lib/garage/data
    restart: unless-stopped

volumes:
  server-data:
  mqtt-data:
  video:
  fotos-meta:
  fotos-data:
