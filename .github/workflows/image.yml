# Betriebs-Image bauen und nach GHCR schieben (Runbook Schritt 3). Ersetzt das lokale
# `docker build` + `docker save | ssh … docker load`.
name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Plattformen, z. B. linux/amd64,linux/arm64 (arm64 läuft unter Emulation und dauert lange)"
        default: linux/amd64
        required: true

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: contains(inputs.platforms, 'arm64')

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # m1-<kurzer Commit> bleibt für den Rückweg, m1 zeigt auf den neuesten Stand von main.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=m1-
            type=raw,value=m1,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
